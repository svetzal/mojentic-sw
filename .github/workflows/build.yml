name: Validate, Test, and Publish

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  # Xcode 27 ships Swift 6.4, the current stable toolchain.
  build-macos:
    runs-on: xcode-27
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Test
        run: swift test --parallel

      - name: Test (all provider traits)
        run: swift test --traits full

      - name: Build (release)
        run: swift build -c release

  build-linux:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    container:
      image: swift:6.4-noble
    steps:
      - uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Test
        run: swift test --parallel

      - name: Test (all provider traits)
        run: swift test --traits full

      - name: Build (release)
        run: swift build -c release

      - name: Build documentation
        run: |
          swift package --disable-sandbox \
            generate-documentation \
            --target Mojentic \
            --output-path .build/docs \
            --warnings-as-errors

  # swift-tools-version 6.1 is the declared minimum (package traits).
  build-linux-minimum:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    container:
      image: swift:6.1-noble
    steps:
      - uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Test (all provider traits)
        run: swift test --traits full

  # Linux swift-format splits doc-comment sentences more strictly than macOS
  # (no NaturalLanguage framework), so the format gate runs on Linux.
  format-check:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    container:
      image: swift:6.4-noble
    steps:
      - uses: actions/checkout@v7

      - name: swift-format lint
        run: swift format lint --strict --recursive Sources Tests

  lint:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    container:
      image: ghcr.io/realm/swiftlint:0.65.1
    steps:
      - uses: actions/checkout@v7

      - name: Run SwiftLint
        run: swiftlint --strict
